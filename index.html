<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aperte o botão</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(135deg, #ff9ecf, #8c52ff);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: white;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: white;
            color: #8c52ff;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #mensagem {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            font-size: 26px;
            font-weight: bold;
            color: #8c52ff;
        }
    </style>
</head>

<body>

    <h1>tenho uma mensagem importante pro cê</h1>

    <button onclick="mostrarMensagem()">
        aperte o botão
    </button>

    <div id="mensagem">
        que seu dia seja tão lindo quanto a sua pica, bjss :).
    </div>

    <script>
        function mostrarMensagem() {
            const mensagem = document.getElementById("mensagem");
            mensagem.style.display = "block";
        }
    </script>

</body>
</html>
